<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{TITLE}}</title>
<style>
:root { --paper:#f8f4ee; --paper-deep:#eee2d2; --ink:#1a0e08; --muted:#6e5a4c; --line:#d7c4b1; --orange:#b54b20; --brown:#3b1e12; --code:#21130e; --code-ink:#faead9; --focus:#005fcc; }
* { box-sizing:border-box; }
html { background:var(--paper); color:var(--ink); scroll-behavior:smooth; }
body { margin:0; font-family:ui-rounded, "Noto Sans KR", system-ui, sans-serif; font-size:16px; line-height:1.65; overflow-wrap:anywhere; }
a { color:inherit; text-underline-offset:3px; }
p, li { text-wrap:pretty; }
a:focus-visible, button:focus-visible, textarea:focus-visible, summary:focus-visible { outline:3px solid var(--focus); outline-offset:3px; }
.skip { position:absolute; left:1rem; top:-4rem; background:var(--ink); color:white; padding:.6rem .9rem; z-index:5; } .skip:focus { top:1rem; }
.hero { background:var(--brown); color:#fff7ef; padding:clamp(2.5rem,8vw,7rem) max(1.25rem,calc((100vw - 1200px)/2)) clamp(2rem,6vw,5rem); }
.hero-inner { max-width:1200px; margin:auto; }
.step-kind { color:var(--muted); font-size:.82rem; font-weight:700; letter-spacing:.04em; }
h1 { max-width:1000px; margin:.25rem 0 .75rem; font-size:clamp(2.5rem,6vw,5.2rem); line-height:1.1; letter-spacing:-.04em; font-weight:750; text-wrap:balance; }
.hero p { max-width:65ch; margin:0; font-size:clamp(1rem,2vw,1.2rem); color:#ffe3cf; }
.provenance { margin-top:1rem !important; font-size:.9rem !important; color:#ffd0af !important; }
.shell { max-width:1200px; margin:0 auto; padding:0 1.25rem 5rem; display:grid; grid-template-columns:15.5rem minmax(0,1fr); gap:clamp(1.5rem,4vw,4rem); }
.sidebar { align-self:start; position:sticky; top:1rem; margin-top:-1.4rem; padding:1.1rem; background:#fffaf3; border:1px solid var(--line); border-radius:1rem; box-shadow:0 10px 28px rgba(59,30,18,.1); }
.mode-label { display:block; margin:0 0 .45rem; font-weight:700; }
.mode-switch { display:flex; gap:.35rem; }
.mode-switch button { flex:1; border:0; border-bottom:2px solid var(--line); padding:.45rem .25rem; background:transparent; color:var(--brown); font:inherit; cursor:pointer; }
.mode-switch button[aria-pressed="true"] { border-color:var(--brown); color:var(--brown); font-weight:800; }
.toc-title { margin:1.2rem 0 .45rem; color:var(--muted); font-size:.78rem; font-weight:700; }
.toc { margin:0; padding:0; list-style:none; border-top:1px solid var(--line); }
.toc a { display:block; padding:.58rem 0 .58rem .1rem; border-bottom:1px solid var(--line); text-decoration:none; line-height:1.3; }
.toc a[aria-current="step"] { color:var(--orange); font-weight:750; }
.toc-number { display:block; margin-bottom:.1rem; color:var(--orange); font-size:.75rem; font-weight:800; }
.main { min-width:0; padding-top:2.4rem; }
.overview { max-width:72ch; padding-bottom:1.6rem; border-bottom:2px solid var(--ink); }
.overview h2 { margin:0 0 .3rem; font-size:1.05rem; }
.diagram { display:inline-block; margin-top:.8rem; color:var(--orange); font-weight:700; }
.status { display:flex; align-items:baseline; gap:.6rem; margin:1.6rem 0 .7rem; color:var(--muted); font-size:.9rem; } .status strong { color:var(--ink); font-size:1rem; }
.step { scroll-margin-top:1rem; padding:clamp(1.2rem,4vw,2.4rem) 0 3rem; border-top:1px solid var(--line); }
.step:first-of-type { border-top:0; }
.step-head { display:grid; grid-template-columns:auto 1fr; gap:1rem; align-items:start; }
.step-head > div { min-width:0; }
.step-number { display:grid; place-items:center; width:3.2rem; height:3.2rem; background:var(--orange); color:white; border-radius:50%; font-size:1.05rem; font-weight:800; }
.step h2 { margin:0; font-size:clamp(1.8rem,4vw,3rem); line-height:1.15; letter-spacing:-.035em; text-wrap:balance; }
.source { margin:.45rem 0 0; color:var(--muted); font-family:ui-monospace, SFMono-Regular, Consolas, monospace; font-size:.82rem; overflow-wrap:anywhere; }
.literal { margin:1.5rem 0; border:1px solid #4b2a1d; border-radius:.7rem; overflow:hidden; background:var(--code); color:var(--code-ink); }
.literal-title { display:flex; justify-content:space-between; gap:1rem; padding:.45rem .8rem; background:#392016; color:#f5c6a4; font:700 .78rem ui-monospace, SFMono-Regular, Consolas, monospace; }
pre { margin:0; padding:1rem; overflow:auto; font: .86rem/1.6 ui-monospace, SFMono-Regular, Consolas, monospace; tab-size:2; }
.section-title { margin:1.6rem 0 .45rem; font-size:1.1rem; }
.explanation { max-width:72ch; } .explanation p { margin:.6rem 0; }
.io { display:grid; grid-template-columns:1fr 1fr; gap:1rem; margin-top:1.3rem; } .io section { border-left:3px solid var(--orange); padding-left:.8rem; } .io h3 { margin:0; font-size:.95rem; } .io ul { margin:.3rem 0; padding-left:1.1rem; }
.learn { max-width:72ch; margin-top:1.8rem; padding:1.1rem 1.15rem; background:var(--paper-deep); border-top:2px solid var(--orange); }
.learn h3 { margin:0 0 .35rem; } .learn p { margin:.4rem 0; } .learn details { margin-top:.8rem; } .learn summary { cursor:pointer; font-weight:750; } .learn textarea { display:block; width:100%; min-height:7rem; margin-top:.8rem; border:1px solid #a98972; border-radius:.35rem; padding:.65rem; background:#fffaf3; color:var(--ink); font:inherit; resize:vertical; }
.learn textarea::placeholder { color:var(--muted); opacity:1; }
.solution { margin-top:1.5rem; padding:1rem 0; border-top:1px solid var(--line); }
.solution > summary { font-weight:750; color:var(--orange); cursor:pointer; }
.mode-explain .solution > summary { display:none; }
.mode-switch, .nav { display:none; }
.js .mode-switch, .js .nav { display:flex; }
.learn label { display:block; margin-top:.9rem; font-weight:700; }
.nav { justify-content:space-between; gap:1rem; margin-top:1.7rem; } .nav button { border:1px solid var(--brown); border-radius:.35rem; padding:.55rem .85rem; background:transparent; color:var(--brown); font:inherit; font-weight:700; cursor:pointer; } .nav button:disabled { opacity:.4; cursor:not-allowed; }
[hidden] { display:none !important; }
@media (max-width:760px) { .shell { display:block; padding:0 1rem 3rem; } .sidebar { position:static; margin-top:-.7rem; } .toc { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); column-gap:1rem; } .main { padding-top:1.7rem; } .io { grid-template-columns:1fr; } }
@media (max-width:420px) { h1 { font-size:3.25rem; } .toc { display:block; } .step-head { gap:.7rem; } .step-number { width:2.6rem; height:2.6rem; } pre { font-size:.78rem; } }
@media (prefers-reduced-motion:reduce) { html { scroll-behavior:auto; } }
</style>
</head>
<body class="mode-{{INITIAL_MODE}}">
<a class="skip" href="#content">본문으로 건너뛰기</a>
<header class="hero"><div class="hero-inner">
  <h1>{{HEADING}}</h1>
  <p>{{SUMMARY}}</p>
  {{PROVENANCE}}
</div></header>
<div class="shell">
  <aside class="sidebar" aria-label="학습 탐색">
    <span class="mode-label">읽는 방식</span>
    <div class="mode-switch" role="group" aria-label="읽는 방식 선택">
      <button type="button" data-mode="learn" aria-pressed="{{LEARN_PRESSED}}" {{LEARN_DISABLED}}>학습</button>
      <button type="button" data-mode="explain" aria-pressed="{{EXPLAIN_PRESSED}}">설명</button>
    </div>
    <p class="toc-title">순서</p>
    <nav aria-label="단계 목차"><ol class="toc">{{TOC}}</ol></nav>
  </aside>
  <main id="content" class="main" tabindex="-1">
    <section class="overview" aria-labelledby="overview-title"><h2 id="overview-title">데이터가 생기는 순서대로</h2><p>코드 블록과 입력을 따라갑니다. 학습 모드에서는 먼저 예측하고 해설을 펼칩니다. 설명 모드에서는 해설을 바로 읽습니다. 답변은 저장하거나 전송하지 않습니다.</p>{{DIAGRAM}}</section>
    <p class="status" aria-live="polite"><strong id="current-step">1 / {{TOTAL_STEPS}}</strong><span id="current-mode">{{MODE_LABEL}}</span></p>
    {{STEPS}}
  </main>
</div>
<script>
(() => {
  document.body.classList.add('js');
  const modeButtons = [...document.querySelectorAll('[data-mode]')];
  const steps = [...document.querySelectorAll('.step')];
  const links = [...document.querySelectorAll('.toc a')];
  const currentStep = document.getElementById('current-step');
  const currentMode = document.getElementById('current-mode');
  let mode = document.body.classList.contains('mode-explain') ? 'explain' : 'learn';
  let active = 0;
  const setMode = (next) => { if (next === 'learn' && modeButtons.find(button => button.dataset.mode === 'learn').disabled) return; mode = next; document.body.classList.toggle('mode-learn', next === 'learn'); document.body.classList.toggle('mode-explain', next === 'explain'); modeButtons.forEach((button) => button.setAttribute('aria-pressed', String(button.dataset.mode === next))); document.querySelectorAll('.learn').forEach((section) => { section.hidden = next !== 'learn'; }); document.querySelectorAll('.solution').forEach(section => { section.open = next === 'explain'; }); currentMode.textContent = next === 'learn' ? '학습 모드' : '설명 모드'; };
  const setActive = (index, focus) => { active = Math.max(0, Math.min(index, steps.length - 1)); const step = steps[active]; links.forEach((link, i) => { if (i === active) link.setAttribute('aria-current', 'step'); else link.removeAttribute('aria-current'); }); currentStep.textContent = `${active + 1} / ${steps.length}`; step.querySelector('[data-prev]').disabled = active === 0; step.querySelector('[data-next]').disabled = active === steps.length - 1; if (focus) step.querySelector('h2').focus({preventScroll:true}); };
  const fromHash = (focus) => { const id = location.hash.slice(1); const index = steps.findIndex((step) => step.id === id); setActive(index < 0 ? 0 : index, focus); };
  modeButtons.forEach((button) => button.addEventListener('click', () => setMode(button.dataset.mode)));
  document.querySelectorAll('[data-prev], [data-next]').forEach((button) => button.addEventListener('click', () => { const index = steps.indexOf(button.closest('.step')); const next = index + (button.hasAttribute('data-next') ? 1 : -1); if (steps[next]) { location.hash = steps[next].id; } }));
  window.addEventListener('hashchange', () => fromHash(true));
  setMode(mode); fromHash(false);
})();
</script>
</body>
</html>
